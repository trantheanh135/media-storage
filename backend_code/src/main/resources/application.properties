# Server Configuration
server.port=8080
server.servlet.context-path=/api

# Database Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/media_storage_db
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA Configuration
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# File Upload Configuration
spring.servlet.multipart.max-file-size=500MB
spring.servlet.multipart.max-request-size=500MB

# Application Configuration
app.upload.dir=/home/uploads/

# JWT Configuration
jwt.secret=${JWT_SECRET:change-this-to-a-long-random-secret-in-production-please}
jwt.expiration-ms=604800000

# Logging
logging.level.root=INFO
logging.level.com.media=DEBUG
