# Server Configuration
server.port=8080
server.servlet.context-path=/api

# Database Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/media_storage_db
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA Configuration
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# File Upload Configuration
spring.servlet.multipart.max-file-size=500MB
spring.servlet.multipart.max-request-size=500MB

# Application Configuration
app.upload.dir=/home/uploads/

# Keycloak Configuration
keycloak.realm=media-storage
keycloak.auth-server-url=http://localhost:8081
keycloak.ssl-required=external
keycloak.resource=media-storage-backend
keycloak.credentials.secret=your-client-secret
keycloak.use-resource-role-mappings=true
keycloak.cors=true

# OAuth2 Resource Server
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8081/realms/media-storage
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://localhost:8081/realms/media-storage/protocol/openid-connect/certs

# Logging
logging.level.root=INFO
logging.level.com.media=DEBUG
logging.level.org.keycloak=INFO
